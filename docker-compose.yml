version: "3.9"

services:
  mysql:
    image: mysql:8.4
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
      MYSQL_DATABASE: ${MYSQL_DB:-labs}
      MYSQL_USER: ${MYSQL_USER:-labs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-labs_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production

      # required by env schema
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev_admin_key_change_me}
      SESSION_SECRET: ${SESSION_SECRET:-dev_session_secret_change_me_123456}

      # DB
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-labs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-labs_password}
      MYSQL_DB: ${MYSQL_DB:-labs}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  mysql_data:
  redis_data:
